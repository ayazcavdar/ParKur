[package]
name = "next_os_installer"
version = "0.2.0"
description = "ParKur — NextOS Loop-Mount Installer"
authors = ["Ayaz Çavdar"]
edition = "2021"

[lib]
name = "next_os_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha-crypt = { version = "0.6.0", features = ["getrandom"] }
backhand = "0.25.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
zstd = "0.13.3"
liblzma = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
